name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

# Los nombres de los jobs (backend y frontend) son los checks obligatorios
# de la protección de ramas: ver docs/flujo-de-trabajo.md.
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Falla si la cobertura de líneas baja del 95 % (coverageThreshold en package.json, RF-028).
      - run: npm run test:coverage
      - name: Cobertura en el resumen del job
        if: always()
        run: |
          node -e "
            const total = require('./coverage/coverage-summary.json').total;
            const rows = ['lines', 'statements', 'functions', 'branches']
              .map((k) => '| ' + k + ' | ' + total[k].pct + ' % |');
            console.log(['### Cobertura de la API', '', '| Métrica | Cobertura |', '|---|---|', ...rows].join('\n'));
          " >> "$GITHUB_STEP_SUMMARY"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng build
      - run: npx ng test --no-watch

  # Pruebas de punta a punta (specs/004-calidad-despliegue, H21): Playwright levanta la API y ng serve
  # (e2e/playwright.config.ts) y Chromium recorre la aplicación como un usuario.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14

  # Deploy simulado (T023): solo en push a main y con backend y frontend en verde,
  # publica el build del frontend como artefacto descargable del run.
  deploy:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng build
      - uses: actions/upload-artifact@v4
        with:
          name: taskflow-frontend
          path: frontend/dist/frontend/browser
          if-no-files-found: error
          retention-days: 30
