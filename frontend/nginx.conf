# nginx del contenedor web (specs/004-calidad-despliegue, H20 y H24).
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Los respaldos JSON pueden pesar hasta 2 MB.
  client_max_body_size 3m;

  # Misma ruta /api que usa el frontend: nginx la reenvía al servicio "api" de docker-compose.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Rutas de Angular (/login, /respaldos…): si no es un archivo, se sirve index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
