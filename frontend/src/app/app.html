<header
  class="sticky top-0 z-20 border-b border-slate-200 bg-white/80 backdrop-blur dark:border-slate-800 dark:bg-slate-900/80"
>
  <div class="mx-auto flex h-16 max-w-7xl items-center gap-3 px-4">
    <a routerLink="/" class="flex items-center gap-2 text-lg font-bold tracking-tight">
      <span class="grid size-8 place-items-center rounded-lg bg-indigo-600 text-white shadow-sm">
        <svg
          class="size-5"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          aria-hidden="true"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="m5 13 4 4L19 7" />
        </svg>
      </span>
      <h1>TaskFlow</h1>
    </a>

    @if (auth.user()) {
      <nav class="ml-4 hidden items-center gap-1 text-sm font-medium sm:flex">
        <a
          routerLink="/"
          routerLinkActive="bg-slate-100 text-slate-900 dark:bg-slate-800 dark:text-white"
          [routerLinkActiveOptions]="{ exact: true }"
          class="rounded-lg px-3 py-2 text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white"
        >
          Tablero
        </a>
      </nav>
    }

    <span class="flex-1"></span>

    <button
      type="button"
      class="btn-icon"
      data-action="theme"
      (click)="theme.toggle()"
      [attr.aria-label]="theme.dark() ? 'Usar tema claro' : 'Usar tema oscuro'"
      [title]="theme.dark() ? 'Usar tema claro' : 'Usar tema oscuro'"
    >
      @if (theme.dark()) {
        <svg
          class="size-5"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="4" />
          <path
            stroke-linecap="round"
            d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
          />
        </svg>
      } @else {
        <svg
          class="size-5"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"
          />
        </svg>
      }
    </button>

    @if (auth.user(); as user) {
      <div class="flex items-center gap-2">
        <span
          class="grid size-9 place-items-center rounded-full bg-indigo-100 text-sm font-semibold text-indigo-700 dark:bg-indigo-500/20 dark:text-indigo-200"
          aria-hidden="true"
          >{{ initials(user.name) }}</span
        >
        <span class="hidden text-sm font-medium md:inline">{{ user.name }}</span>
      </div>
      <button
        type="button"
        class="btn btn-secondary px-2.5 sm:px-3"
        data-action="logout"
        aria-label="Cerrar sesión"
        title="Cerrar sesión"
        (click)="auth.logout()"
      >
        <svg
          class="size-4"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M15 17l5-5-5-5M20 12H9M12 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7"
          />
        </svg>
        <span class="hidden sm:inline">Cerrar sesión</span>
      </button>
    }
  </div>
</header>

<main class="mx-auto max-w-7xl px-4 py-6">
  <router-outlet />
</main>
