<section class="grid min-h-[calc(100vh-10rem)] place-items-center">
  <div class="card w-full max-w-md space-y-5 p-8">
    <div class="space-y-1 text-center">
      <h2 class="text-2xl font-bold tracking-tight">Iniciar sesión</h2>
      <p class="text-sm text-slate-500 dark:text-slate-400">Bienvenido de nuevo a TaskFlow</p>
    </div>

    @if (error() ?? notice(); as message) {
      <p class="alert-error" role="alert">{{ message }}</p>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="space-y-4">
      <label class="block">
        <span class="label">Correo</span>
        <input class="input" type="email" formControlName="email" autocomplete="email" />
      </label>
      @if (submitted() && form.controls.email.invalid) {
        <p class="field-error">Ingresa tu correo</p>
      }

      <label class="block">
        <span class="label">Contraseña</span>
        <input
          class="input"
          type="password"
          formControlName="password"
          autocomplete="current-password"
        />
      </label>
      @if (submitted() && form.controls.password.invalid) {
        <p class="field-error">Ingresa tu contraseña</p>
      }

      <button type="submit" class="btn btn-primary w-full" [disabled]="loading()">
        {{ loading() ? 'Ingresando…' : 'Iniciar sesión' }}
      </button>
    </form>

    <p class="text-center text-sm text-slate-600 dark:text-slate-400">
      ¿No tienes cuenta?
      <a
        class="font-semibold text-indigo-600 hover:underline dark:text-indigo-400"
        routerLink="/registro"
        >Regístrate</a
      >
    </p>
  </div>
</section>
