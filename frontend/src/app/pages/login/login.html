<section class="auth-page">
  <h2>Iniciar sesión</h2>

  @if (error() ?? notice(); as message) {
    <p role="alert">{{ message }}</p>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label>
      Correo
      <input type="email" formControlName="email" autocomplete="email" />
    </label>
    @if (submitted() && form.controls.email.invalid) {
      <p class="field-error">Ingresa tu correo</p>
    }

    <label>
      Contraseña
      <input type="password" formControlName="password" autocomplete="current-password" />
    </label>
    @if (submitted() && form.controls.password.invalid) {
      <p class="field-error">Ingresa tu contraseña</p>
    }

    <button type="submit" [disabled]="loading()">
      {{ loading() ? 'Ingresando…' : 'Iniciar sesión' }}
    </button>
  </form>

  <p>¿No tienes cuenta? <a routerLink="/registro">Regístrate</a></p>
</section>
