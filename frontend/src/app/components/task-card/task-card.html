<article
  class="task-card rounded-xl border border-l-4 border-slate-200 bg-white p-4 shadow-sm transition hover:shadow-md dark:border-slate-800 dark:bg-slate-900"
  [class]="accent()"
>
  <h3 class="font-semibold leading-snug break-words">{{ task().title }}</h3>
  @if (task().description) {
    <p data-field="description" class="mt-1 text-sm text-slate-600 break-words dark:text-slate-400">
      {{ task().description }}
    </p>
  }

  <div class="mt-3 flex flex-wrap items-center gap-2 text-xs">
    <span class="rounded-full px-2 py-0.5 font-semibold" [class]="chip()">{{
      task().priority
    }}</span>
    @if (task().assignee) {
      <span
        data-field="assignee"
        class="inline-flex items-center gap-1 rounded-full bg-slate-100 px-2 py-0.5 font-medium text-slate-700 dark:bg-slate-800 dark:text-slate-300"
      >
        <svg
          class="size-3.5"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <circle cx="12" cy="8" r="4" />
          <path stroke-linecap="round" d="M4 21a8 8 0 0 1 16 0" />
        </svg>
        {{ task().assignee }}
      </span>
    }
  </div>

  <div
    class="mt-3 flex flex-wrap items-center gap-1 border-t border-slate-100 pt-3 dark:border-slate-800"
  >
    @for (target of targets(); track target.status) {
      <button
        type="button"
        class="rounded-md px-2 py-1 text-xs font-medium text-indigo-700 hover:bg-indigo-50 dark:text-indigo-300 dark:hover:bg-indigo-500/10"
        [attr.data-move]="target.status"
        [attr.aria-label]="'Mover a ' + target.label"
        (click)="move.emit({ id: task().id, status: target.status })"
      >
        → {{ target.label }}
      </button>
    }
    <span class="flex-1"></span>
    <button
      type="button"
      class="btn-icon size-8"
      data-action="edit"
      aria-label="Editar"
      title="Editar"
      (click)="edit.emit(task().id)"
    >
      <svg
        class="size-4"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        aria-hidden="true"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="m16.9 3.6 3.5 3.5L8 19.5 3.5 20.5l1-4.5L16.9 3.6Z"
        />
      </svg>
    </button>
    <button
      type="button"
      class="btn-icon size-8 hover:text-rose-600 dark:hover:text-rose-400"
      data-action="delete"
      aria-label="Eliminar"
      title="Eliminar"
      (click)="remove.emit(task().id)"
    >
      <svg
        class="size-4"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        aria-hidden="true"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M4 7h16M10 11v6m4-6v6M6 7l1 13h10l1-13M9 7V4h6v3"
        />
      </svg>
    </button>
  </div>
</article>
